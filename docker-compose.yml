# docker compose up --build   ->  http://localhost:3000
# Put API keys in backend/.env (optional). Data persists in the named volumes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanwise
      POSTGRES_PASSWORD: scanwise
      POSTGRES_DB: scanwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanwise -d scanwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://scanwise:scanwise@db:5432/scanwise
      DATA_DIR: /app/data
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - files:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  files:
